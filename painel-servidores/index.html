<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESTART - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    
    <div class="brand-header">
      <div class="logo-icon">
        <i class="fa-solid fa-ticket"></i>
      </div>
      <h1>RESTART</h1>
      <p class="subtitle">Samel | Sistema de start servidores</p>
    </div>

    <div class="card-login">
      <h2>Bem-vindo</h2>

      <form id="form-login">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" autocomplete="email" required placeholder="Seu e-mail">
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="senha" autocomplete="current-password" required placeholder="Sua senha">
            <i class="fa-regular fa-eye toggle-password" id="btn-eye" style="cursor: pointer;"></i>
          </div>
        </div>

        <button type="submit" id="btn-entrar" class="btn-entrar">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>

        <div class="card-links">
          <a href="#" class="link-esqueceu">Esqueceu sua senha?</a>
          <p class="txt-criar">Não tem conta? <a href="#">Criar Conta</a></p>
        </div>
      </form>
    </div>

    <footer class="footer">
      <p>© 2026 Samel Assistência Médica. Todos os direitos reservados.</p>
    </footer>

  </div>

  <script>
    const API_URL = '/api';

    document.addEventListener('DOMContentLoaded', () => {
      // Toggle para mostrar/esconder senha no login
      const btnEye = document.getElementById('btn-eye');
      const inputSenha = document.getElementById('senha');
      if (btnEye && inputSenha) {
        btnEye.addEventListener('click', () => {
          const tipo = inputSenha.getAttribute('type') === 'password' ? 'text' : 'password';
          inputSenha.setAttribute('type', tipo);
          btnEye.classList.toggle('fa-eye');
          btnEye.classList.toggle('fa-eye-slash');
        });
      }

      // Tratamento do envio do formulário de login
      const formLogin = document.getElementById('form-login');
      if (formLogin) {
        formLogin.addEventListener('submit', async (e) => {
          e.preventDefault();

          const email = document.getElementById('email')?.value || '';
          const senha = document.getElementById('senha')?.value || '';

          try {
            const res = await fetch(`${API_URL}/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, senha })
            });

            const data = await res.json().catch(() => ({}));

            if (res.ok && data.success) {
              // Salva os dados do usuário autenticado no localStorage
              if (data.usuario) {
                localStorage.setItem('usuarioLogado', JSON.stringify(data.usuario));
              }
              window.location.href = 'dashboard.html';
            } else {
              alert('Falha no login: ' + (data.message || 'E-mail ou senha incorretos.'));
            }
          } catch (err) {
            console.error('Erro no login:', err);
            alert('Erro de conexão com o servidor.');
          }
        });
      }
    });
  </script>
</body>
</html>
