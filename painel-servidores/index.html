<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>RESTART - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    
    <div class="brand-header">
      <div class="logo-icon">
        <i class="fa-solid fa-ticket"></i>
      </div>
      <h1>RESTART</h1>
      <p class="subtitle">Samel | Sistema de start servidores</p>
    </div>

    <div class="card-login">
      <h2>Bem-vindo</h2>

      <!-- Elemento opcional para exibir mensagens de erro direto na tela -->
      <div id="msg-erro" style="display: none; background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;"></div>

      <form id="form-login">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" autocomplete="off" required placeholder="Seu e-mail">
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="senha" autocomplete="current-password" required placeholder="Sua senha">
            <i class="fa-regular fa-eye toggle-password" id="btn-eye" style="cursor: pointer;"></i>
          </div>
        </div>

        <button type="submit" id="btn-entrar" class="btn-entrar">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>

        <div class="card-links" style="text-align: center; margin-top: 15px;">
          <span style="color: #94a3b8; font-size: 0.9rem;">Mestre</span>
        </div>
      </form>
    </div>

    <footer class="footer">
      <p>© 2026 Samel Assistência Médica. Todos os direitos reservados.</p>
    </footer>

  </div>

  <script>
    const API_URL = '/api';

    document.addEventListener('DOMContentLoaded', () => {
      // Toggle para mostrar/esconder senha no login
      const btnEye = document.getElementById('btn-eye');
      const inputSenha = document.getElementById('senha');
      if (btnEye && inputSenha) {
        btnEye.addEventListener('click', () => {
          const tipo = inputSenha.getAttribute('type') === 'password' ? 'text' : 'password';
          inputSenha.setAttribute('type', tipo);
          btnEye.classList.toggle('fa-eye');
          btnEye.classList.toggle('fa-eye-slash');
        });
      }

      // Tratamento do envio do formulário de login
      const formLogin = document.getElementById('form-login');
      const msgErro = document.getElementById('msg-erro');

      if (formLogin) {
        formLogin.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (msgErro) msgErro.style.display = 'none';

          const email = document.getElementById('email')?.value.trim() || '';
          const senha = document.getElementById('senha')?.value.trim() || '';

          try {
            const res = await fetch(`${API_URL}/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, senha })
            });

            const data = await res.json().catch(() => ({}));

            if (res.ok && data.success) {
              if (data.usuario) {
                localStorage.setItem('usuarioLogado', JSON.stringify(data.usuario));
              }
              window.location.href = 'dashboard.html';
            } else {
              const erroMsg = data.message || 'E-mail ou senha incorretos.';
              if (msgErro) {
                msgErro.textContent = erroMsg;
                msgErro.style.display = 'block';
              } else {
                alert('Falha no login: ' + erroMsg);
              }
            }
          } catch (err) {
            console.error('Erro no login:', err);
            if (msgErro) {
              msgErro.textContent = 'Erro de conexão com o servidor.';
              msgErro.style.display = 'block';
            } else {
              alert('Erro de conexão com o servidor.');
            }
          }
        });
      }
    });
  </script>
</body>
</html>
